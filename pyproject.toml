[tool.poetry]
name = "pythonproject4"
version = "0.1.0"
description = ""
authors = ["Алексей Токарев <tokarev_76@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
flake8 = ">=7.5.0"
poetry-core = "^2.5.0"
black = ">=26.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)"
]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.idea
    | \.mypy_cache
  )/
)
'''